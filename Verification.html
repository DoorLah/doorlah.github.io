<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DoorLah - Email Verification Successful">
    <title>Email Verified - DoorLah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Root Variables */
        :root {
            --primary-navy: #0A1628;
            --secondary-navy: #152238;
            --accent-orange: #FF6B35;
            --accent-light: #FF8C5A;
            --text-primary: #FFFFFF;
            --text-secondary: #B8C5D6;
            --text-muted: #7A8BA0;
            --bg-dark: #050B14;
            --bg-card: #1A2942;
            --border-color: #2A3F5F;
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .verification-container {
            max-width: 600px;
            width: 100%;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }

        .logo-container {
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(255, 107, 53, 0.3));
        }

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s ease-out;
        }

        .success-icon svg {
            width: 50px;
            height: 50px;
            stroke: white;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            animation: checkmark 0.5s ease-out 0.3s both;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes checkmark {
            from {
                stroke-dasharray: 100;
                stroke-dashoffset: 100;
            }
            to {
                stroke-dasharray: 100;
                stroke-dashoffset: 0;
            }
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .highlight {
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .message {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            line-height: 1.8;
        }

        .message-secondary {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .info-box {
            background: var(--secondary-navy);
            border-radius: 12px;
            padding: 24px;
            margin-top: 30px;
            border: 1px solid var(--border-color);
        }

        .info-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .email-link {
            color: var(--accent-orange);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .email-link:hover {
            color: var(--accent-light);
            text-decoration: underline;
        }

        .divider {
            height: 1px;
            background: var(--border-color);
            margin: 30px 0;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .verification-container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 26px;
            }

            .logo {
                width: 100px;
                height: 100px;
            }

            .success-icon {
                width: 70px;
                height: 70px;
            }

            .success-icon svg {
                width: 40px;
                height: 40px;
            }

            .message {
                font-size: 16px;
            }

            .message-secondary {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="verification-container">
        <div class="logo-container">
            <img src="images/doorlah_splash.png" alt="DoorLah Logo" class="logo">
        </div>

        <div class="success-icon">
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>

        <h1>
            Email <span class="highlight">Verified!</span>
        </h1>

        <p class="message">
            Your email has been successfully verified and your account is now active.
        </p>

        <p class="message-secondary">
            You can now head back to the DoorLah app to login and start connecting with your community.
        </p>

        <div class="divider"></div>

        <div class="info-box">
            <div class="info-title">Need Help?</div>
            <p class="message-secondary" style="margin-bottom: 0;">
                If you face any issues, please email us at<br>
                <a href="mailto:doorlah.singapore@gmail.com" class="email-link">doorlah.singapore@gmail.com</a>
            </p>
        </div>
    </div>
</body>
</html>
